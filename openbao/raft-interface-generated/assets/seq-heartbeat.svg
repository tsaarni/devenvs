<svg viewBox="0 0 700 422" width="700" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Layer 0: white canvas -->
  <rect x="0" y="0" width="700" height="422" fill="#ffffff"/>

  <!-- Layer 2: lifelines. Leader x=180, Follower x=520; head boxes end at y=58, lifelines start at 63 -->
  <path d="M180,63 L 180,400" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <path d="M520,63 L 520,400" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Layer 2: messages. start = lifeline ±5, end = lifeline ∓11 -->
  <!-- 1. Leader -> Follower: heartbeat -->
  <path d="M185,100 L 509,100" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- 2. Follower self-call, bulging left into the channel, returning to 509 = lifeline - 11 -->
  <path d="M515,140 C 480,142 480,180 509,180" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <!-- 3. Follower -> Leader reply -->
  <path d="M515,224 L 191,224" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-muted)"/>
  <!-- 5. Leader -> Follower: next heartbeat -->
  <path d="M185,300 L 509,300" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- 6. Follower -> Leader reply -->
  <path d="M515,346 L 191,346" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-muted)"/>

  <!-- Layer 3: participant head boxes, 312x36 (28px apart), baseline = 22 + 18 + 4.2 -->
  <rect x="24" y="22" width="312" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="180" y="44" font-size="12" fill="#1e40af" text-anchor="middle">Leader</text>
  <rect x="364" y="22" width="312" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="520" y="44" font-size="12" fill="#166534" text-anchor="middle">Follower</text>

  <!-- Layer 3: labels, baseline = arrow y - 13; notes in muted italic below their arrow -->
  <text x="350" y="87" font-size="10" fill="#64748b" text-anchor="middle">AppendEntries (heartbeat)</text>
  <text x="350" y="121" font-size="10" fill="#94a3b8" font-style="italic" text-anchor="middle">Term=5, no entries</text>
  <text x="468" y="168" font-size="10" fill="#64748b" text-anchor="end">reset timer, remember leader</text>
  <text x="350" y="211" font-size="10" fill="#64748b" text-anchor="middle">Success=true, Term=5</text>
  <text x="193" y="258" font-size="10" fill="#94a3b8" font-style="italic">repeat every 0.5–1 s</text>
  <text x="350" y="287" font-size="10" fill="#64748b" text-anchor="middle">AppendEntries (heartbeat)</text>
  <text x="350" y="333" font-size="10" fill="#64748b" text-anchor="middle">Success=true</text>
  <!-- Election timeout note, pink, beside the follower lifeline near its end -->
  <text x="508" y="382" font-size="10" fill="#9d174d" font-style="italic" text-anchor="end">no heartbeat for 5–10 s → start election</text>
</svg>
