<svg viewBox="0 0 700 454" width="700" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Layer 0: white canvas -->
  <rect x="0" y="0" width="700" height="454" fill="#ffffff"/>

  <!-- Layer 2: lifelines. Leader x=180, Follower x=520 -->
  <path d="M180,63 L 180,392" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>
  <path d="M520,63 L 520,392" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Layer 2: messages. start = lifeline ±5, end = lifeline ∓11 -->
  <!-- 1. Leader -> Follower: expects the follower to hold #48 -->
  <path d="M185,100 L 509,100" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- 2. Follower self-call: consistency check fails -->
  <path d="M515,128 C 480,130 480,168 509,168" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <!-- 3. Follower -> Leader rejection, red dashed reply -->
  <path d="M515,212 L 191,212" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
  <!-- 4. Leader self-call: move next index back -->
  <path d="M185,240 C 220,242 220,280 191,280" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- 5. Leader -> Follower: retry from the follower's last entry -->
  <path d="M185,324 L 509,324" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- 6. Follower -> Leader reply -->
  <path d="M515,370 L 191,370" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-muted)"/>

  <!-- Layer 3: participant head boxes, 312x36, 28px apart; baseline = 22 + 18 + 4.2 -->
  <rect x="24" y="22" width="312" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="180" y="44" font-size="12" fill="#1e40af" text-anchor="middle">Leader</text>
  <rect x="364" y="22" width="312" height="36" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="520" y="44" font-size="12" fill="#166534" text-anchor="middle">Follower</text>

  <!-- Layer 3: labels, baseline = arrow y - 13 -->
  <text x="350" y="87" font-size="10" fill="#64748b" text-anchor="middle">AppendEntries Prev=#48 [#49]</text>
  <text x="468" y="156" font-size="10" fill="#64748b" text-anchor="end">I have only up to #40</text>
  <text x="350" y="199" font-size="10" fill="#9d174d" text-anchor="middle">Success=false, LastLog=40</text>
  <text x="232" y="268" font-size="10" fill="#64748b">next = 41</text>
  <text x="350" y="311" font-size="10" fill="#64748b" text-anchor="middle">AppendEntries Prev=#40 [#41..#49]</text>
  <text x="350" y="357" font-size="10" fill="#64748b" text-anchor="middle">Success=true</text>

  <!-- Footnotes below the lifelines -->
  <text x="24" y="414" font-size="10" fill="#64748b">Up to 64 entries per request.</text>
  <text x="24" y="429" font-size="10" fill="#64748b">If #41 is no longer in the leader's log → InstallSnapshot.</text>
</svg>
