<svg viewBox="0 0 740 313" width="740" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#a855f7"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- White canvas, same size as the viewBox -->
  <rect x="0" y="0" width="740" height="313" fill="#ffffff"/>

  <!-- Layout: two groups of 340px (x 20..360 and 380..720), 20px canvas margin on every side.
       Inside a group: leader row y 50..104, follower row y 134..188 (30px gap),
       followers 140px wide, 30px apart, 15px inner padding. Key rows below the nodes. -->

  <!-- Group backgrounds -->
  <rect x="20" y="20" width="340" height="250" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="30" y="34" font-size="11" fill="#64748b">Normal operation</text>
  <rect x="380" y="20" width="340" height="250" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="390" y="34" font-size="11" fill="#64748b">Election</text>

  <!-- Normal operation connectors.
       Raft (blue, outer): leader side -5 -> follower top -11, cp2 above the end so the head points down.
       gRPC (purple dashed, inner): follower top -5 -> leader side -11, cp2 level with the end. -->
  <path d="M115,64 Q 55,64 55,123" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M265,64 Q 325,64 325,123" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M90,129 Q 90,90 109,90" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
  <path d="M290,129 Q 290,90 271,90" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>

  <!-- Election connectors: candidate -> openbao-2 straight (same row), candidate -> crashed node red dashed. -->
  <path d="M540,161 L 554,161" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <path d="M415,129 Q 415,77 469,77" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>

  <!-- Normal operation nodes. Two-line boxes: 54px, baselines box y + 22 and + 40. -->
  <rect x="120" y="50" width="140" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="190" y="72" font-size="12" fill="#1e40af" text-anchor="middle">openbao-0</text>
  <text x="190" y="90" font-size="12" fill="#1e40af" text-anchor="middle">leader (active)</text>

  <rect x="35" y="134" width="140" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="105" y="156" font-size="12" fill="#166534" text-anchor="middle">openbao-1</text>
  <text x="105" y="174" font-size="12" fill="#166534" text-anchor="middle">follower (standby)</text>

  <rect x="205" y="134" width="140" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="275" y="156" font-size="12" fill="#166534" text-anchor="middle">openbao-2</text>
  <text x="275" y="174" font-size="12" fill="#166534" text-anchor="middle">follower (standby)</text>

  <!-- Election nodes, same positions shifted 360px right -->
  <rect x="480" y="50" width="140" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="550" y="72" font-size="12" fill="#9d174d" text-anchor="middle">openbao-0</text>
  <text x="550" y="90" font-size="12" fill="#9d174d" text-anchor="middle">crashed</text>

  <rect x="395" y="134" width="140" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="465" y="156" font-size="12" fill="#b45309" text-anchor="middle">openbao-1</text>
  <text x="465" y="174" font-size="12" fill="#b45309" text-anchor="middle">candidate</text>

  <rect x="565" y="134" width="140" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="635" y="156" font-size="12" fill="#166534" text-anchor="middle">openbao-2</text>
  <text x="635" y="174" font-size="12" fill="#166534" text-anchor="middle">follower</text>

  <!-- Arrow keys: 26px swatch, label starts 12px after it, baseline = swatch y + 4 -->
  <path d="M35,213 L 61,213" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="73" y="217" font-size="10" fill="#64748b">AppendEntries, heartbeats,</text>
  <text x="73" y="232" font-size="10" fill="#64748b">InstallSnapshot, TimeoutNow</text>
  <path d="M35,247 L 61,247" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="73" y="251" font-size="10" fill="#64748b">gRPC forwarding (not raft)</text>

  <path d="M395,213 L 421,213" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="433" y="217" font-size="10" fill="#64748b">RequestPreVote, RequestVote</text>
  <path d="M395,247 L 421,247" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="433" y="251" font-size="10" fill="#64748b">dial fails</text>

  <!-- Footnote, centred on the content centre (20 + 720) / 2 = 370 -->
  <text x="370" y="290" font-size="10" fill="#64748b" text-anchor="middle">Arrow = side that opens the TLS connection and sends requests. Replies return on the same connection.</text>
</svg>
