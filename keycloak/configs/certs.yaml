# CAs
subject: cn=external-server-ca
---
subject: cn=internal-server-ca
---
subject: cn=external-client-ca
---
subject: cn=internal-client-ca
---

# Keycloak HTTPS (via ingress)
subject: cn=keycloak-server
issuer: cn=external-server-ca
sans:
  - DNS:keycloak.127-0-0-121.nip.io
  - DNS:keycloak.127-0-0-1.nip.io
  - DNS:localhost
---
# IDP federation: expired cert testing
subject: cn=keycloak-server-expired
issuer: cn=external-server-ca
sans:
  - DNS:keycloak.127-0-0-121.nip.io
  - DNS:keycloak.127-0-0-1.nip.io
  - DNS:localhost
not_before: 2023-10-01T09:00:00Z
not_after: 2023-10-29T09:00:00Z
---

# Pod-to-pod server certs
subject: cn=keycloak-internal
issuer: cn=internal-server-ca
sans:
  - DNS:keycloak
  - DNS:keycloak-headless
---
subject: cn=postgres
issuer: cn=internal-server-ca
sans:
  - DNS:postgres
  - DNS:localhost
---
subject: cn=openldap
issuer: cn=internal-server-ca
sans:
  - DNS:openldap
  - DNS:localhost
  - IP:127.0.0.1
---

# External client certs
subject: cn=x509client
issuer: cn=external-client-ca

---
# CRL testing: generates external-client-ca-crl.pem
subject: cn=revoked-client
issuer: cn=external-client-ca
revoked: true
---

# Internal client certs (pod-to-pod)
subject: cn=ldap-admin,ou=users,o=example
issuer: cn=internal-client-ca
---
subject: cn=envoy-client
issuer: cn=internal-client-ca
---
subject: cn=keycloak-db-client
issuer: cn=internal-client-ca
---
subject: cn=keycloak-ldap-client
issuer: cn=internal-client-ca
