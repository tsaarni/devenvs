apiVersion: v1
kind: Service
metadata:
  name: openldap
  labels:
    app: openldap
spec:
  ports:
    - name: ldap
      port: 389
    - name: ldaps
      port: 636
  selector:
    app: openldap
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
  labels:
    app: openldap
spec:
  selector:
    matchLabels:
      app: openldap
  template:
    metadata:
      labels:
        app: openldap
    spec:
      containers:
        - name: openldap
          image: localhost/openldap:latest
          imagePullPolicy: Never
          ports:
            - name: ldap
              containerPort: 389
            - name: ldaps
              containerPort: 636

          env:
            - name: CERT_FILENAME
              value: /host/certs/openldap.pem
            - name: KEY_FILENAME
              value: /host/certs/openldap-key.pem
            - name: CA_FILENAME
              value: /host/certs/internal-client-ca.pem

          volumeMounts:
            - name: host
              mountPath: /host
              readOnly: true
            - name: data
              mountPath: /data
            - name: output
              mountPath: /output

      volumes:
        - name: host
          hostPath:
            path: /host
        - name: data
          emptyDir: {}
        - name: output
          emptyDir: {}
